name: banner-fingerprint
services:
  server:
    build:
      context: .
      target: server
    restart: unless-stopped
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 128m
    cpus: 1.0
    networks: [fingerprint]
    volumes:
      - ./rules:/app/rules:ro
    healthcheck:
      test: ["CMD", "/app/server", "-healthcheck"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 5
    stop_grace_period: 15s
  client:
    build:
      context: .
      target: client
    depends_on:
      server:
        condition: service_healthy
    restart: "no"
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 32
    mem_limit: 64m
    cpus: 0.5
    networks: [fingerprint]
    volumes:
      - ./samples:/data:ro
networks:
  fingerprint:
    internal: true
