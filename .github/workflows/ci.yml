name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.3'
          cache: false
      - run: go test -race ./...
      - run: go vet ./...
      - run: docker compose config --quiet
      - run: docker compose up --build -d
      - run: docker compose wait client
      - if: always()
        run: docker compose logs && docker compose down
